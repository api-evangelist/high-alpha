aid: high-alpha
name: High Alpha
description: 'High Alpha is a venture firm and venture studio based in Indianapolis,
  Indiana that creates and funds early-stage B2B SaaS companies. Through its Capital
  arm it makes pre-seed to Series B investments across the United States, and through
  its Studio it co-founds companies with entrepreneurs, providing design, brand, marketing,
  recruiting, product design, and go-to-market services. Founded by ExactTarget co-founder
  and CEO Scott Dorsey along with Eric Tobias, Mike Fitzgerald, and Studio Science
  founder Kristian Andersen, High Alpha pioneered the venture studio model and publishes
  the annual SaaS Benchmarks Report. Studio and portfolio companies include Salesloft,
  Lessonly, Attentive, Logik.ai, LogicGate, Dwolla, Zylo, and project44.'
